name: Latest master APK

# Builds the GitHub-flavor DEBUG app on every push to master and publishes it
# to a rolling "latest-master" pre-release (replaced on each build), with a
# version.json that debug builds read to offer updates.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-master
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Robolectric downloads Android runtime jars on first use; keep them between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      # Optional: add these repo secrets so every build is signed with the same key
      # and installs as an update over the previous one:
      # SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Smoke-test the main flows
        run: |
          chmod +x gradlew
          ./gradlew :app:testGithubDebugUnitTest --stacktrace

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}-master
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleGithubDebug --stacktrace
          cp app/build/outputs/apk/github/debug/app-github-debug.apk gapwise-latest-master.apk
          printf '{"versionCode": %s, "versionName": "%s", "commit": "%s"}\n' \
            "$VERSION_CODE" "$VERSION_NAME" "$GITHUB_SHA" > version.json

      - name: Publish latest-master release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-master --yes --cleanup-tag || true
          gh release create latest-master gapwise-latest-master.apk version.json \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest master" \
            --notes "Automatic build of \`master\` at ${GITHUB_SHA::7} (run #${{ github.run_number }}). Debug build of the GitHub flavor; it checks this pre-release for updates. Replaced on every push."
