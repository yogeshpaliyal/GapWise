name: Latest master build

on:
  push:
    branches: [main, master]
    # Only rebuild when something that ends up in the APK (or this build itself) changes.
    # README, docs and other workflows don't trigger a new debug build.
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/latest-master.yml"
  workflow_dispatch:

permissions:
  contents: write

# Only the newest push matters; cancel older runs so they can't overwrite a newer APK.
concurrency:
  group: latest-master
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # Robolectric downloads Android runtime jars on first use; keep them between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Smoke-test the main flows, and build both release variants through R8
        run: ./gradlew --no-configuration-cache :app:testGithubDebugUnitTest :app:assembleGithubRelease :app:assembleFdroidRelease :app:bundlePlayRelease

      - name: Build debug APK
        run: ./gradlew --no-configuration-cache :app:assembleGithubDebug

      - name: Rename APK and write version.json
        run: |
          cp app/build/outputs/apk/github/debug/app-github-debug.apk gapwise-debug.apk
          # Debug builds compare this commit with the one they were built from.
          printf '{"commit": "%s", "versionName": "master %s"}\n' "$GITHUB_SHA" "${GITHUB_SHA::7}" > version.json

      - name: Publish to "Latest master" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed via env (not inlined) so commit messages can't inject shell.
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          NOTES="Debug build of \`${SHORT_SHA}\` on \`${GITHUB_REF_NAME}\`.

          ${COMMIT_MSG}

          Installs as \"GapWise Debug\" (com.yogeshpaliyal.gapwise.debug), next to the release and Play versions. Signed with the repo's debug keystore, so it updates over earlier builds from this release, and the app tells you when a newer one is here."

          # Recreate the release so the tag always points at the newest commit.
          gh release delete latest-master --cleanup-tag --yes || true
          gh release create latest-master gapwise-debug.apk version.json \
            --title "Latest master" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --prerelease
