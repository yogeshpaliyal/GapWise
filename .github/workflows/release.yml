name: Release

# Push a tag like v1.2.0 to publish a real GitHub Release:
#  - gapwise-<version>.apk        GitHub flavor, release build (checks GitHub releases for updates)
#  - gapwise-<version>-play.aab   Play flavor bundle, for uploading to Google Play
#
# Play rejects bundles signed with a debug key. Add these repository secrets so
# release builds use your upload key: SIGNING_KEYSTORE_BASE64,
# SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS='.' read -r MAJ MIN PAT <<< "${VERSION%%-*}"
          # Monotonic for Play: 1.2.3 -> 1002003
          CODE=$(( ${MAJ:-0} * 1000000 + ${MIN:-0} * 1000 + ${PAT:-0} ))
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Decode signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test, then build both flavors
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testGithubDebugUnitTest :app:assembleGithubRelease :app:bundlePlayRelease --stacktrace
          cp app/build/outputs/apk/github/release/app-github-release.apk "gapwise-$VERSION_NAME.apk"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "gapwise-$VERSION_NAME-play.aab"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "gapwise-$VERSION_NAME.apk" "gapwise-$VERSION_NAME-play.aab" \
            --title "Gapwise $VERSION_NAME" \
            --generate-notes \
            --latest
