# F-Droid build recipe for GapWise. Submit it as metadata/com.yogeshpaliyal.gapwise.yml in a merge
# request to https://gitlab.com/fdroid/fdroiddata (see fdroid/README.md in this repo).
#
# F-Droid builds the fdroid flavor from each tag, compares it with gapwise-vX-fdroid.apk from the
# GitHub release (Binaries) and, if they match, publishes the APK signed with our key
# (AllowedAPKSigningKeys). So F-Droid, IzzyOnDroid and GitHub installs can update each other.
Categories:
  - Time
License: GPL-3.0-or-later
AuthorName: Yogesh Choudhary Paliyal
AuthorWebSite: https://yogeshpaliyal.com
SourceCode: https://github.com/yogeshpaliyal/GapWise
IssueTracker: https://github.com/yogeshpaliyal/GapWise/issues
Changelog: https://github.com/yogeshpaliyal/GapWise/releases

AutoName: GapWise

RepoType: git
Repo: https://github.com/yogeshpaliyal/GapWise.git
Binaries: https://github.com/yogeshpaliyal/GapWise/releases/download/v%v/gapwise-v%v-fdroid.apk

Builds:
  - versionName: 0.3.0
    versionCode: 5
    commit: d93c19c001f9953f3d0fa593cf95ec21e5119a86
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y openjdk-17-jdk-headless
      - update-java-alternatives -a
    gradle:
      - fdroid

AllowedAPKSigningKeys: 9016a68e60e5dd033aea17ddd0e9a86cbd80645fe017c832a64c35b3667b76a3

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
CurrentVersion: 0.3.0
CurrentVersionCode: 5
